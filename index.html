<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AETHER TECH</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Cinzel:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #020617; --card-dark: rgba(15, 23, 42, 0.75); --border-dark: rgba(255, 255, 255, 0.12); --text-main: #f8fafc; --text-muted: #94a3b8; --cyan: #06b6d4; --purple: #a855f7; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); }
        h1, h2, h3 { font-family: 'Cinzel', serif; }

        header { display: flex; justify-content: space-between; align-items: center; padding: 16px 5%; background: rgba(2, 6, 23, 0.85); border-bottom: 1px solid var(--border-dark); }
        .logo-box { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text-main); }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-left: 20px; }
        nav a:hover, nav a.active { color: var(--cyan); }

        .container { padding: 60px 5%; max-width: 800px; margin: 0 auto; }
        .contact-box { background: var(--card-dark); border: 1px solid var(--border-dark); padding: 40px; border-radius: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--cyan); }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-dark); background: rgba(0,0,0,0.4); color: white; }
        .btn-grad { background: linear-gradient(135deg, var(--purple), var(--cyan)); color: white; padding: 12px 30px; border: none; border-radius: 25px; font-weight: 700; cursor: pointer; }

        footer { padding: 30px 5%; border-top: 1px solid var(--border-dark); text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 60px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo-box">
            <h3 style="font-size: 18px; font-weight: 800;">AETHER TECH</h3>
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1 style="font-size: 36px; text-align: center; margin-bottom: 30px; color: var(--cyan);">Get In Touch</h1>
        
        <div class="contact-box">
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Write your query here..." required></textarea>
                </div>
                <button type="submit" class="btn-grad">Send Message 🚀</button>
            </form>
            
            <hr style="margin: 30px 0; border-color: var(--border-dark);">
            <p style="font-size: 14px; color: var(--text-muted);">Direct WhatsApp: <strong>+91 99255 27617</strong></p>
            <p style="font-size: 14px; color: var(--text-muted);">Instagram: <strong>@just_silent.hues</strong></p>
        </div>
    </div>

    <footer>
        <p>© 2026 Aether Tech Corporation. All Rights Reserved.</p>
    </footer>
</body>
</html>
